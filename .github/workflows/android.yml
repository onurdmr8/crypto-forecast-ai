name: Build Signed Android APK & AAB (Bundle)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore app/release.keystore \
            -alias cryptoforecast \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass cryptoforecast2026 \
            -keypass cryptoforecast2026 \
            -dname "CN=CryptoForecast, OU=Mobile, O=CryptoForecast, L=Istanbul, ST=Istanbul, C=TR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Signed Debug APK & Release Bundle (AAB)
        run: gradle assembleDebug bundleRelease --stacktrace

      - name: Upload Signed Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Signed Release AAB (Google Play Bundle)
        uses: actions/upload-artifact@v4
        with:
          name: app-release-bundle-signed
          path: app/build/outputs/bundle/release/app-release.aab
